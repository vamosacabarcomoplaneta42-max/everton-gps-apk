name: Gerar APK Everton GPS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar o app (index.html e modo Família)
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi
          if [ ! -f www/index.html ]; then
            echo "ERRO: coloque o index.html do Everton GPS na raiz do repositório (ou dentro da pasta www)."
            exit 1
          fi
          cp modo-familia.js www/modo-familia.js
          if ! grep -q 'modo-familia.js' www/index.html; then
            sed -i 's#</body>#<script src="modo-familia.js"></script>\n</body>#' www/index.html
          fi
          if ! grep -q 'modo-familia.js' www/index.html; then
            echo "ERRO: não encontrei </body> no index.html para ligar o modo Família."
            exit 1
          fi

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícone e tela de abertura
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png splash.png assets/
          npx --yes @capacitor/assets generate --android
          f=android/app/src/main/res/values/ic_launcher_background.xml
          if [ -f "$f" ]; then sed -i -E 's|(name="ic_launcher_background">)[^<]*|\1#0A8FD6|' "$f"; fi

      - name: Ícone da notificação de rastreio
        continue-on-error: true
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_tracking.xml << 'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:fillType="evenOdd"
                android:pathData="M12,2C8.13,2 5,5.13 5,9c0,5.25 7,13 7,13s7,-7.75 7,-13c0,-3.87 -3.13,-7 -7,-7zM12,11.5c-1.38,0 -2.5,-1.12 -2.5,-2.5s1.12,-2.5 2.5,-2.5 2.5,1.12 2.5,2.5 -1.12,2.5 -2.5,2.5z"/>
          </vector>
          XML
          s=android/app/src/main/res/values/strings.xml
          sed -i 's#</resources>#    <string name="capacitor_background_geolocation_notification_icon">drawable/ic_tracking</string>\n</resources>#' "$s"

      - name: Ajustar permissões, serviço de localização e assinatura
        run: python3 scripts/patch-android.py

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Compilar o APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Nomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Everton-GPS.apk

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: Everton-GPS-apk
          path: Everton-GPS.apk
