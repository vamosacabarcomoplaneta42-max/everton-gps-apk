<style>
:root{--bg-main:#0a0d12;--bg-card:#131820;--border:rgba(255,255,255,.08);--signal-on:#00ffa6;--signal-off:#ffb020;--danger:#ff5470;--telemetry:#2dd4ff;--text:#eef2f6;--text-dim:#74808f;color-scheme:dark}
body{margin:0;padding:0;font-family:system-ui,sans-serif;background:var(--bg-main);color:var(--text);display:flex;height:100vh;overflow:hidden}
.sidebar{width:380px;background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%}
#map{flex:1;height:100%;background:#e8e6e0}
.header{padding:16px;border-bottom:1px solid var(--border);text-align:center}

.content{padding:16px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px}

.box-title{font-size:0.72em;text-transform:uppercase;color:var(--text-dim);font-weight:bold;margin-bottom:8px}
select,input,button{width:100%;background:#1a212b;border:1px solid var(--border);padding:10px;border-radius:6px;color:white;font-size:0.95em;box-sizing:border-box;color-scheme:dark}
button{background:var(--telemetry);color:#000;font-weight:bold;cursor:pointer;margin-top:8px;border:none}
button.sec{background:#1a212b;color:var(--text);border:1px solid var(--border)}
.telemetry-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.88em}
.badge{font-size:0.75em;padding:3px 8px;border-radius:4px;font-weight:bold}
.badge-movimento{background:rgba(0,255,166,0.15);color:var(--signal-on)}
.badge-parado{background:rgba(255,176,32,0.15);color:var(--signal-off)}
.badge-perigo{background:rgba(255,84,112,0.15);color:var(--danger)}
.live-indicator{display:inline-block;width:8px;height:8px;background:var(--signal-on);border-radius:50%;margin-right:6px}
.auth-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:10000}
.auth-card{background:var(--bg-card);border:1px solid var(--border);padding:24px;border-radius:12px;width:90%;max-width:360px;display:flex;flex-direction:column;gap:16px}
.leaflet-popup-content-wrapper{background:var(--bg-card);color:var(--text);border:1px solid var(--border);border-radius:12px}
.leaflet-popup-tip{background:var(--bg-card)}
.popup-rua{font-weight:bold;font-size:1em;margin-bottom:4px}
.popup-vel{color:var(--telemetry);font-family:ui-monospace,monospace;font-size:1.1em;font-weight:bold}
.popup-linha{font-size:0.85em;color:var(--text-dim);margin-top:3px}
.popup-limite{font-size:0.9em;margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(45,212,255,0.12);border:1px solid rgba(45,212,255,0.25);font-weight:bold}
.popup-limite.acima{background:rgba(255,84,112,0.18);border-color:rgba(255,84,112,0.4);color:var(--danger)}
@media(max-width:768px){body{flex-direction:column-reverse}.sidebar{width:100%;height:50vh}#map{height:50vh}}
</style>

<div class="box"><div class="box-title">📅 Histórico</div><input type="date" id="filtroData"><div style="display:flex;gap:6px;margin-top:6px;"><input type="time" id="filtroHoraInicio" value="00:00"><input type="time" id="filtroHoraFim" value="23:59"></div><button id="btnBuscarHistorico">🔍 Buscar Histórico</button><button id="btnVoltarTempoReal" style="background:var(--signal-on);display:none;">🟢 Tempo Real</button></div>

<script>
var MAPTILER_KEY = "Lf1G9agog5yDhlo9haAO";
var firebaseConfig = {
    apiKey: "AIzaSyDwKIS8wL3D7OuaysVFV_xyAsFsKo2eXzY",
    authDomain: "everton-gps.firebaseapp.com",
    databaseURL: "https://everton-gps-default-rtdb.firebaseio.com",
    projectId: "everton-gps",
    storageBucket: "everton-gps.firebasestorage.app",
    messagingSenderId: "688936933095",
    appId: "1:688936933095:web:790b2407334e8b148e3442"
};
firebase.initializeApp(firebaseConfig);
var db=firebase.database(), auth=firebase.auth();
// MAPA COM LETRA GRANDE - BRIGHT V2 tem fonte 2x maior que streets-v2 e fundo claro igual Waze/Google
var map=L.map('map',{zoomControl:true}).setView([-29.6133,-52.1919],13);
var camadaBase=L.tileLayer('https://api.maptiler.com/maps/bright-v2/{z}/{x}/{y}.png?key='+MAPTILER_KEY,{
    tileSize:512,
    zoomOffset:-1,
    maxZoom:20,
    attribution:'© MapTiler © OpenStreetMap'
}).addTo(map);

var marcadorVeiculo=L.marker([-29.6133,-52.1919]).addTo(map);
var camadaRotaAtual=L.layerGroup().addTo(map);
var camadaTodos=L.layerGroup();
var cacheLimite={};
var popupAtual=null;

function calcularDistanciaMetros(lat1,lon1,lat2,lon2){
    var R=6371000,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
    var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function parseDataHoraAdmin(d,h){
    var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(d||''), t=/^(\d{2}):(\d{2}):(\d{2})$/.exec(h||'');
    if(!m||!t) return null;
    return new Date(+m[3],+m[2]-1,+m[1],+t[1],+t[2],+t[3]).getTime();
}

async function buscarLimiteVia(lat,lon){
    var chave = lat.toFixed(4)+","+lon.toFixed(4);
    if(cacheLimite[chave]!==undefined) return cacheLimite[chave];
    try{
        var query = `[out:json][timeout:4];way(around:25,${lat},${lon})[highway][maxspeed];out tags 1;`;
        var res = await fetch("https://overpass-api.de/api/interpreter?data="+encodeURIComponent(query));
        var data = await res.json();
        if(data.elements && data.elements[0] && data.elements[0].tags && data.elements[0].tags.maxspeed){
            var max = data.elements[0].tags.maxspeed;
            if(max.includes("BR:urban")) max="60";
            if(max.includes("BR:rural")) max="80";
            if(max.includes("BR:motorway")) max="110";
            var num = parseInt(max);
            if(!isNaN(num)){ cacheLimite[chave]=num; return num; }
        }
        var query2 = `[out:json][timeout:4];way(around:15,${lat},${lon})[highway];out tags 1;`;
        var res2 = await fetch("https://overpass-api.de/api/interpreter?data="+encodeURIComponent(query2));
        var data2 = await res2.json();
        if(data2.elements && data2.elements[0] && data2.elements[0].tags){
            var hw=data2.elements[0].tags.highway;
            if(hw==='motorway'||hw==='trunk'){ cacheLimite[chave]=110; return 110; }
            if(hw==='primary'){ cacheLimite[chave]=80; return 80; }
            if(hw==='secondary'){ cacheLimite[chave]=60; return 60; }
            if(hw==='residential'){ cacheLimite[chave]=40; return 40; }
        }
    }catch(e){}
    cacheLimite[chave]=null; return null;
}
function statusRealDoPonto(ponto,pontoAnterior){
    if(!pontoAnterior) return (ponto.velocidade||0)>3?"EM MOVIMENTO":"PARADO";
    var dist=calcularDistanciaMetros(pontoAnterior.lat,pontoAnterior.lon,ponto.lat,ponto.lon);
    var t1=parseDataHoraAdmin(pontoAnterior.data,pontoAnterior.hora), t2=parseDataHoraAdmin(ponto.data,ponto.hora);
    var dt=(t1&&t2)?(t2-t1)/1000:0;
    if(dt>0 && dt<180){
        if(dist>15) return "EM MOVIMENTO";
        if(dist/dt*3.6>4) return "EM MOVIMENTO";
    }
    if((ponto.velocidade||0)>4) return "EM MOVIMENTO";
    return "PARADO";
}
function corPorStatusPonto(ponto,pontoAnterior){
    return statusRealDoPonto(ponto,pontoAnterior)==="EM MOVIMENTO"?'#00ffa6':'#ffb020';
}
function limparRotaAtual(){ camadaRotaAtual.clearLayers(); }

function desenharTrechoClicavel(p1,p2,cor){
    var coords=[[p1.lat,p1.lon],[p2.lat,p2.lon]];
    // Linha invisível GROSSA pra facilitar o toque no celular
    var toque=L.polyline(coords,{color:'#000',opacity:0,weight:35}).addTo(camadaRotaAtual);
    var vis=L.polyline(coords,{color:cor,weight:7,opacity:0.95,lineCap:'round',lineJoin:'round'}).addTo(camadaRotaAtual);
    var fn=function(){ mostrarInfoDoPontoRapido(p2); };
    toque.on('click',fn);
    vis.on('click',fn);
    // Também permite clique no mapa próximo
    toque.on('touchend',fn);
    vis.on('touchend',fn);
}

function filtrarRuidoGPS(pontos){
    if(pontos.length<2) return pontos;
    var res=[pontos[0]];
    for(var i=1;i<pontos.length;i++){
        var ant=res[res.length-1], cur=pontos[i];
        if(!cur.lat||!cur.lon) continue;
        var dist=calcularDistanciaMetros(ant.lat,ant.lon,cur.lat,cur.lon);
        var tAnt=parseDataHoraAdmin(ant.data,ant.hora), tCur=parseDataHoraAdmin(cur.data,cur.hora);
        var dt=tAnt&&tCur?Math.abs(tCur-tAnt)/1000:999;
        if(dist<10 && (cur.velocidade||0)<3) continue;
        if(dt<15 && dist>250) continue; // pula salto de GPS
        res.push(cur);
    }
    return res;
}
function desenharRotaClicavel(pontos,opcoes){
    opcoes=opcoes||{}; limparRotaAtual();
    var validos=filtrarRuidoGPS(pontos.filter(function(p){return p&&p.lat!=null;}));
    if(validos.length===0) return;
    if(validos.length===1){ if(!opcoes.manterEnquadramento) map.setView([validos[0].lat,validos[0].lon],17); return; }
    if(!opcoes.manterEnquadramento){ try{ map.fitBounds(L.polyline(validos.map(function(p){return [p.lat,p.lon]})).getBounds(),{padding:[30,30],maxZoom:18}); }catch(e){} }
    for(var i=0;i<validos.length-1;i++){
        var p1=validos[i],p2=validos[i+1];
        var dist=calcularDistanciaMetros(p1.lat,p1.lon,p2.lat,p2.lon);
        // Se for muito longe, não desenha (evita linha atravessando cidade)
        if(dist>300) continue;
        desenharTrechoClicavel(p1,p2,corPorStatusPonto(p2,p1));
    }
}

// NOVA FUNÇÃO: abre popup INSTANTANEAMENTE, depois busca limite
function mostrarInfoDoPontoRapido(ponto){
    if(!ponto) return;
    atualizarPainelEletricoSimples(ponto);
    var vel = ponto.velocidade||0;
    var sitReal = statusRealDoPonto(ponto,null);
    // Abre popup imediatamente SEM esperar Overpass
    var htmlInicial = '<div class="popup-rua">'+(ponto.rua||"Rua não localizada")+'</div>'+
               '<div class="popup-vel">'+vel+' km/h · '+sitReal+'</div>'+
               '<div class="popup-limite" id="popup-limite-temp">🚦 Buscando limite da via...</div>'+
               '<div class="popup-linha">🏘️ '+(ponto.bairro||"—")+'</div>'+
               '<div class="popup-linha">🏙️ '+(ponto.cidade||"—")+' / '+(ponto.estado||"—")+'</div>'+
               '<div class="popup-linha" style="margin-top:6px;color:#74808f;">'+(ponto.data||"")+' '+(ponto.hora||"")+'</div>';
    popupAtual = L.popup({closeButton:true,maxWidth:300,className:'popup-grande'}).setLatLng([ponto.lat,ponto.lon]).setContent(htmlInicial).openOn(map);
    
    // Busca limite em segundo plano e atualiza popup + painel
    buscarLimiteVia(ponto.lat, ponto.lon).then(function(limite){
        var limiteTxt = limite ? limite+" km/h" : "Não cadastrado";
        var aviso = "";
        var classe = "popup-limite";
        if(limite){
            if(vel > limite){ aviso="⚠️ ACIMA DO LIMITE"; classe="popup-limite acima"; }
            else { aviso="✅ Dentro do limite"; }
        }
        // Atualiza painel lateral
        document.getElementById('txtLimiteVia').textContent = limiteTxt;
        document.getElementById('txtLimiteVia').style.color = (limite && vel > limite) ? 'var(--danger)' : 'var(--telemetry)';
        
        // Atualiza popup se ainda estiver aberto
        var el = document.getElementById('popup-limite-temp');
        if(el){
            el.className = classe;
            el.innerHTML = '🚦 Limite da via: <b>'+limiteTxt+'</b><br>'+aviso;
        }
    });
}

var veiculoSelecionado="", veiculoComListenerAtivo=null, primeiraCentralizacaoFeita=false, listenerTempoReal=null, dadosHistoricoCarregados=[], EMPRESA_ID_ADMIN=null, tipoEmpresaAdmin=null, dadosTodasUnidades={};
function sanitizarChavePath(v){return String(v).replace(/[.#$\[\]\/]/g,"_");}
function caminhoVeiculos(){return 'empresas/'+sanitizarChavePath(EMPRESA_ID_ADMIN)+'/veiculos';}
document.getElementById('filtroData').value=new Date().toISOString().slice(0,10);
document.getElementById('btnEntrarPainel').addEventListener('click',function(){
    var e=document.getElementById('authEmail').value.trim(), s=document.getElementById('authSenha').value;
    var erro=document.getElementById('erroLogin');
    if(!e||!s) return alert("Preencha");
    erro.style.display="none";
    auth.signInWithEmailAndPassword(e,s).catch(function(){ erro.textContent="Acesso negado"; erro.style.display="block"; });
});
auth.onAuthStateChanged(function(user){
    if(user){
        document.getElementById('authOverlay').style.display="none";
        document.getElementById('userLogado').textContent="🟢 "+user.email;
        db.ref('mapaUsuarioEmpresa/'+user.uid).once('value').then(function(snap){
            EMPRESA_ID_ADMIN=snap.val(); if(!EMPRESA_ID_ADMIN){ auth.signOut(); return; } inicializarEscutaBanco();
        });
    }else{
        EMPRESA_ID_ADMIN=null;
        document.getElementById('authOverlay').style.display="flex";
        document.getElementById('selectVeiculo').innerHTML='<option value="">Aguardando login...</option>';
    }
});
document.getElementById('btnSair').addEventListener('click',function(){auth.signOut();});
var TEXTOS_POR_TIPO={ frota:{titulo:'🚚 Veículo',unidade:'veículo',icone:'🚗'}, familia:{titulo:'👨‍👩‍👧 Pessoa',unidade:'pessoa',icone:'👤'}, combo:{titulo:'📍 Unidade',unidade:'unidade',icone:'📍'} };
function textosDoTipo(){return TEXTOS_POR_TIPO[tipoEmpresaAdmin]||TEXTOS_POR_TIPO.combo;}
function inicializarEscutaBanco(){
    db.ref(caminhoVeiculos()).on('value',function(snap){
        var sel=document.getElementById('selectVeiculo'), ant=sel.value;
        sel.innerHTML='<option value="">-- Escolha --</option>'; dadosTodasUnidades={};
        if(snap.exists()){
            snap.forEach(function(ch){ var k=ch.key; dadosTodasUnidades[k]=ch.val(); var o=document.createElement('option'); o.value=k; o.textContent=textosDoTipo().icone+" "+k.replace(/_/g,' '); sel.appendChild(o); });
            if(ant) sel.value=ant;
        }
    });
    db.ref('empresas/'+sanitizarChavePath(EMPRESA_ID_ADMIN)+'/tipo').on('value',function(s){ var v=s.val(); tipoEmpresaAdmin=(v==='frota'||v==='familia'||v==='combo')?v:null; document.getElementById('tituloSelecionar').textContent=textosDoTipo().titulo; });
}
document.getElementById('selectVeiculo').addEventListener('change',function(e){ veiculoSelecionado=e.target.value; if(veiculoSelecionado) verificarEAtivarTempoReal(); });
function verificarEAtivarTempoReal(){
    if(listenerTempoReal&&veiculoComListenerAtivo) db.ref(caminhoVeiculos()+'/'+veiculoComListenerAtivo+'/atual').off('value',listenerTempoReal);
    veiculoComListenerAtivo=veiculoSelecionado;
    document.getElementById('statusModo').innerHTML='<span class="live-indicator"></span> TEMPO REAL - Letra Grande';
    document.getElementById('btnVoltarTempoReal').style.display="none";
    primeiraCentralizacaoFeita=false;
    listenerTempoReal=db.ref(caminhoVeiculos()+'/'+veiculoSelecionado+'/atual').on('value',function(snap){ if(!snap.exists()) return; atualizarPainelEletricoSimples(snap.val(),{seguindoAoVivo:true}); desenharLinhaDoTempoReal(); });
}
function desenharLinhaDoTempoReal(){
    db.ref(caminhoVeiculos()+'/'+veiculoSelecionado+'/historico').limitToLast(50).once('value',function(snap){
        var pts=[]; snap.forEach(function(c){ var p=c.val(); if(p&&p.lat&&p.lon) pts.push(p); });
        desenharRotaClicavel(pts,{manterEnquadramento:primeiraCentralizacaoFeita});
    });
}
document.getElementById('btnVerTodos').addEventListener('click',function(){
    camadaTodos.clearLayers();
    var pontos=[];
    Object.keys(dadosTodasUnidades).forEach(function(ch){
        var atual=dadosTodasUnidades[ch]&&dadosTodasUnidades[ch].atual;
        if(!atual||atual.lat==null) return;
        L.circleMarker([atual.lat,atual.lon],{radius:9,weight:2,color:'#fff',fillColor:corPorStatusPonto(atual,null),fillOpacity:0.95}).addTo(camadaTodos);
        pontos.push([atual.lat,atual.lon]);
    });
    camadaTodos.addTo(map);
    if(pontos.length>1){ try{ map.fitBounds(L.latLngBounds(pontos),{padding:[40,40]}); }catch(e){} }
});
function buscarHistoricoComFiltro(cb){
    var dataF=document.getElementById('filtroData').value, hI=document.getElementById('filtroHoraInicio').value, hF=document.getElementById('filtroHoraFim').value;
    if(!dataF){ alert("Selecione data"); return; }
    var partes=dataF.split('-'), br=partes[2]+"/"+partes[1]+"/"+partes[0];
    db.ref(caminhoVeiculos()+'/'+veiculoSelecionado+'/historico').once('value',function(snap){
        var res=[]; snap.forEach(function(ch){ var p=ch.val(); if(p&&p.data===br){ var hc=(p.hora||'').slice(0,5); if(hc>=hI&&hc<=hF) res.push(p); } });
        cb(res);
    });
}
document.getElementById('btnBuscarHistorico').addEventListener('click',function(){
    if(!veiculoSelecionado) return alert("Selecione veículo");
    if(listenerTempoReal&&veiculoComListenerAtivo) db.ref(caminhoVeiculos()+'/'+veiculoComListenerAtivo+'/atual').off('value',listenerTempoReal);
    listenerTempoReal=null;
    document.getElementById('statusModo').innerHTML='📅 HISTÓRICO';
    document.getElementById('btnVoltarTempoReal').style.display="block";
    buscarHistoricoComFiltro(function(res){
        dadosHistoricoCarregados=res;
        if(res.length===0){ alert("Nenhum registro"); verificarEAtivarTempoReal(); return; }
        atualizarPainelEletricoSimples(res[res.length-1]);
        desenharRotaClicavel(res);
    });
});
document.getElementById('btnVoltarTempoReal').addEventListener('click',verificarEAtivarTempoReal);
function atualizarPainelEletricoSimples(dados,opcoes){
    if(!dados||!dados.lat||!dados.lon) return;
    opcoes=opcoes||{};
    var latlng=[dados.lat,dados.lon]; marcadorVeiculo.setLatLng(latlng);
    if(opcoes.seguindoAoVivo){
        if(!primeiraCentralizacaoFeita){ map.setView(latlng,17); primeiraCentralizacaoFeita=true; }
        else if(!map.getBounds().pad(-0.15).contains(latlng)) map.panTo(latlng,{animate:true});
    }else map.setView(latlng,17);
    var real = statusRealDoPonto(dados,null);
    document.getElementById('txtVelocidade').textContent=(dados.velocidade||0)+" km/h";
    document.getElementById('txtTempoParado').textContent= real==="EM MOVIMENTO" ? "Em movimento" : (dados.tempoParado||"Parado");
    document.getElementById('txtRua').textContent=dados.rua||"—";
    document.getElementById('txtCidadeEstado').textContent=(dados.cidade||"—")+" / "+(dados.estado||"—");
    document.getElementById('txtDataHora').textContent=dados.data+" às "+dados.hora;
    var badge=document.getElementById('txtStatus');
    badge.textContent=real;
    badge.className = real==="EM MOVIMENTO" ? "badge badge-movimento" : "badge badge-parado";
}
</script>
